name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '9.0.x'
      - name: Install MAUI workload
        run: dotnet workload install maui
      - name: Publish Windows
        run: dotnet publish src/MediaHub.csproj -c Release -f net9.0-windows10.0.19041.0 -r win-x64 --self-contained true -p:WindowsPackageType=None -p:PublishSingleFile=true -p:PublishTrimmed=false -p:IncludeNativeLibrariesForSelfExtract=true -p:UseMonoRuntime=false -p:PublishReadyToRun=false
      - name: Upload exe
        uses: actions/upload-artifact@v7
        with:
          name: MediaHub-exe
          path: src/bin/Release/net9.0-windows10.0.19041.0/win-x64/publish/*.exe
          if-no-files-found: error

  build-macos:
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '9.0.x'
      - name: Select Xcode 26.5
        run: sudo xcode-select -s /Applications/Xcode_26.5.app
      - name: Install MAUI workload
        run: dotnet workload install maui
      - name: Publish macOS
        run: |
          dotnet publish src/MediaHub.csproj \
            -c Release -f net9.0-maccatalyst \
            -p:CreatePackage=false -p:EnableCodeSigning=false -p:CodesignKey=-
      - name: Package app (pkg preferred, zip fallback)
        shell: bash
        run: |
          set -e
          APP_PATH=$(ls -d src/bin/Release/net9.0-maccatalyst/*.app | head -1)
          echo "Found app bundle: $APP_PATH"
          APP_DIR=$(dirname "$APP_PATH")
          APP_NAME=$(basename "$APP_PATH")
          mkdir -p artifact
          if command -v productbuild >/dev/null 2>&1; then
            productbuild --component "$APP_PATH" /Applications artifact/MediaHub.pkg \
              && echo "PKG created" \
              || echo "productbuild FAILED, will fallback to zip"
          else
            echo "productbuild not available, will fallback to zip"
          fi
          if [ ! -f artifact/MediaHub.pkg ]; then
            echo "Falling back to zip"
            (cd "$APP_DIR" && zip -r -q "$GITHUB_WORKSPACE/artifact/MediaHub.zip" "$APP_NAME")
          fi
          ls -la artifact/
      - name: Upload pkg/zip
        uses: actions/upload-artifact@v7
        with:
          name: MediaHub-macos
          path: artifact/
          if-no-files-found: error

  release:
    needs: [build-windows, build-macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
      - name: List artifacts
        run: find . -type f | sort
      - name: Delete previous release/tag
        run: |
          if gh release view v4.3.6 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release delete v4.3.6 --yes --cleanup-tag --repo "$GITHUB_REPOSITORY"
          fi
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v4.3.6
          files: |
            MediaHub-exe/*.exe
            MediaHub-macos/*
          generate_release_notes: true
